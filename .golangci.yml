version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Tests read fixtures from testdata/ by variable path.
      - path: _test\.go
        linters: [gosec]
  settings:
    misspell:
      locale: UK
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gordonmurray/outofstate.dev
