name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - "docs/report.schema.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site is plain files. The install script and the report schema
      # are copied from the repository at deploy time so they never drift.
      - name: Assemble the site
        run: |
          mkdir -p _site/schema
          cp -R site/. _site/
          cp scripts/install.sh _site/install.sh
          cp docs/report.schema.json _site/schema/report.v1.json
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write    # deploy to GitHub Pages
      id-token: write # verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
