name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser snapshot needs tags and history
          persist-credentials: false

      # Same pinned toolchain as local development (tools/Dockerfile).
      - name: check-versions, lint, test, vuln, build, release-check
        run: make ci

      # The snapshot build includes the macOS binaries; test them on macOS.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-binaries
          path: dist/oos_darwin_*/oos
          if-no-files-found: error
          retention-days: 3

  macos:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26        # Apple Silicon
            dir: oos_darwin_arm64_v8.0
            platform: darwin/arm64
          - runner: macos-15-intel  # Intel
            dir: oos_darwin_amd64_v1
            platform: darwin/amd64
    name: macos (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-binaries
          path: dist
      - name: Smoke test
        run: |
          chmod +x "dist/${{ matrix.dir }}/oos"
          test/smoke.sh "dist/${{ matrix.dir }}/oos" "${{ matrix.platform }}"
